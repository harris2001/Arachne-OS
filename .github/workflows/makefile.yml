name: Build and Test Arachne OS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker development environment
      working-directory: devs
      run: docker build . -t dev-environment

    - name: Build the kernel
      run: docker run --rm -v $(pwd):/root/env dev-environment make all

    - name: Verify build artifacts
      run: |
        [ -f build/kernel.bin ] && echo "Kernel binary created" || exit 1
        [ -f build/arachne_i686.iso ] && echo "ISO image created" || exit 1

    - name: Test kernel boot
      run: docker run --rm -v $(pwd):/root/env dev-environment make test-ci

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: arachne-os-build
        path: |
          build/kernel.bin
          build/arachne_i686.iso
        retention-days: 30
